<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>UpTech - Detalhes do Produto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0a0a;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: #e6edf3;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        /* ========== BOTÃO VOLTAR ========== */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            padding: 8px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 40px;
            transition: all 0.2s;
        }

        .back-button:active {
            background: #21262d;
            color: #fff;
        }

        /* ========== CABEÇALHO DO PRODUTO ========== */
        .product-header {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .product-header h1 {
            font-size: 22px;
            color: #f0f6fc;
        }

        .product-header .price {
            font-size: 28px;
            font-weight: 800;
            color: #00e5ff;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.15);
            margin: 8px 0;
        }

        /* ========== GALERIA DE FOTOS (MAIORES) ========== */
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .gallery-item {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s;
        }

        .gallery-item:active {
            border-color: #00e5ff;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .fallback-emoji {
            font-size: 40px;
            color: #30363d;
        }

        /* ========== DESCRIÇÃO E ESPECIFICAÇÕES ========== */
        .info-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .info-box h2 {
            font-size: 16px;
            color: #f0f6fc;
            margin-bottom: 10px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
        }

        .info-box p {
            font-size: 15px;
            line-height: 1.6;
            color: #c9d1d9;
        }

        .info-box ul {
            list-style: none;
            padding: 0;
        }

        .info-box ul li {
            padding: 6px 0;
            font-size: 14px;
            color: #c9d1d9;
            border-bottom: 1px solid #0d1117;
        }

        .info-box ul li:last-child {
            border-bottom: none;
        }

        .includes-box {
            background: #0d1117;
            border-left: 3px solid #00e5ff;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .includes-box strong {
            color: #00e5ff;
        }
        .includes-box p {
            color: #c9d1d9;
            font-size: 14px;
            margin-top: 4px;
        }

        /* ========== BOTÃO WHATSAPP ========== */
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(37, 211, 102, 0.3);
            transition: all 0.2s;
            text-decoration: none;
            margin-top: 10px;
        }

        .btn-whatsapp:active {
            transform: scale(0.96);
            box-shadow: 0 3px 15px rgba(37, 211, 102, 0.15);
        }

        .btn-whatsapp i {
            font-style: normal;
            font-size: 24px;
        }

        /* ========== LIGHTBOX (MODAL DE IMAGENS) ========== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            font-weight: 300;
            transition: transform 0.2s;
            background: none;
            border: none;
            line-height: 1;
        }

        .lightbox .close-btn:active {
            transform: scale(0.8);
        }

        .lightbox .lightbox-image {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            object-fit: contain;
        }

        .lightbox .nav-arrows {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }

        .lightbox .nav-arrows button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 36px;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            min-width: 60px;
        }

        .lightbox .nav-arrows button:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }

        .lightbox .counter {
            color: #8b949e;
            font-size: 14px;
            margin-top: 12px;
        }

        /* ========== RODAPÉ ========== */
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #30363d;
            font-size: 12px;
            border-top: 1px solid #21262d;
            padding-top: 20px;
        }

        @media (max-width: 420px) {
            .product-header h1 { font-size: 18px; }
            .product-header .price { font-size: 24px; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .btn-whatsapp { font-size: 16px; padding: 16px; }
            .lightbox .nav-arrows button { font-size: 28px; padding: 8px 16px; min-width: 50px; }
            .lightbox .close-btn { top: 10px; right: 20px; font-size: 32px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- BOTÃO VOLTAR -->
    <a href="index.html" class="back-button">← Voltar ao catálogo</a>

    <!-- CONTEÚDO DINÂMICO -->
    <div id="productDetail">
        <!-- Preenchido via JavaScript -->
    </div>

    <div class="footer">
        © 2026 <strong>UpTech</strong> — Tecnologia que conecta você.
    </div>
</div>

<!-- LIGHTBOX (MODAL) -->
<div id="lightbox" class="lightbox">
    <button class="close-btn" id="closeLightbox">✕</button>
    <img id="lightboxImg" class="lightbox-image" src="" alt="Imagem ampliada">
    <div class="nav-arrows">
        <button id="prevImage">‹</button>
        <button id="nextImage">›</button>
    </div>
    <div class="counter" id="imageCounter">1 / 3</div>
</div>

<script src="produtos.js"></script>
<script>
    // =============================================
    // 🔥 CONFIGURAÇÕES
    // =============================================
    const WHATSAPP_NUMBER = "5574988316054";

    // =============================================
    // ⚙️ LÓGICA DO PRODUTO
    // =============================================
    function getProductId() {
        const params = new URLSearchParams(window.location.search);
        return parseInt(params.get('id'));
    }

    // Variáveis globais para o lightbox
    let currentImages = [];
    let currentIndex = 0;

    function abrirLightbox(index) {
        if (!currentImages.length) return;
        currentIndex = index;
        const img = document.getElementById('lightboxImg');
        img.src = currentImages[currentIndex];
        document.getElementById('lightbox').classList.add('active');
        atualizarContador();
        document.body.style.overflow = 'hidden'; // travar scroll
    }

    function fecharLightbox() {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
    }

    function navegar(direcao) {
        const total = currentImages.length;
        if (total === 0) return;
        currentIndex = (currentIndex + direcao + total) % total;
        document.getElementById('lightboxImg').src = currentImages[currentIndex];
        atualizarContador();
    }

    function atualizarContador() {
        document.getElementById('imageCounter').textContent = 
            `${currentIndex + 1} / ${currentImages.length}`;
    }

    // =============================================
    // RENDERIZAR PÁGINA DE DETALHES
    // =============================================
    function renderizarProduto() {
        const id = getProductId();
        const product = products.find(p => p.id === id);

        if (!product) {
            document.getElementById('productDetail').innerHTML = `
                <div class="info-box" style="text-align:center; padding:40px;">
                    <h2>😕 Produto não encontrado</h2>
                    <p style="color:#8b949e;">Volte para a vitrine e escolha outro produto.</p>
                    <a href="index.html" style="color:#00e5ff; display:inline-block; margin-top:16px;">← Voltar</a>
                </div>
            `;
            return;
        }

        // Salvar imagens para o lightbox
        currentImages = product.images && product.images.length > 0 ? product.images : [];
        if (currentImages.length === 0) {
            // Fallback com emojis
            currentImages = ['📸', '📷', '🖼️'];
        }

        // ======== GERAR GALERIA (IMAGENS MAIORES) ========
        let galleryHtml = '';
        if (product.images && product.images.length > 0) {
            product.images.forEach((imgUrl, index) => {
                galleryHtml += `
                    <div class="gallery-item" onclick="abrirLightbox(${index})">
                        <img src="${imgUrl}" alt="${product.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'fallback-emoji\\'>${product.emoji || '📦'}</span>'">
                    </div>
                `;
            });
        } else {
            // Fallback
            for (let i = 0; i < 3; i++) {
                galleryHtml += `
                    <div class="gallery-item" onclick="abrirLightbox(${i})">
                        <span class="fallback-emoji">📷</span>
                    </div>
                `;
            }
        }

        // ======== ESPECIFICAÇÕES ========
        let specsHtml = '';
        if (product.specs && product.specs.length > 0) {
            product.specs.forEach(spec => {
                specsHtml += `<li>${spec}</li>`;
            });
        } else {
            specsHtml = `<li style="color:#8b949e;">Nenhuma especificação listada.</li>`;
        }

        // ======== ITENS INCLUÍDOS ========
        let includesHtml = '';
        if (product.includes) {
            includesHtml = `
                <div class="includes-box">
                    <strong>📦 Itens incluídos:</strong>
                    <p>${product.includes}</p>
                </div>
            `;
        }

        // ======== MONTAR PÁGINA ========
        const html = `
            <div class="product-header">
                <h1>${product.name}</h1>
                <div class="price">${product.price}</div>
            </div>

            <div class="gallery">
                ${galleryHtml}
            </div>

            <div class="info-box">
                <h2>📖 Sobre o produto</h2>
                <p>${product.fullDesc || product.shortDesc}</p>
                ${includesHtml}
            </div>

            <div class="info-box">
                <h2>⚙️ Especificações técnicas</h2>
                <ul>${specsHtml}</ul>
            </div>

            <!-- BOTÃO WHATSAPP -->
            <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(
                `Olá, UpTech! Vi no site e quero comprar: ${product.name} (${product.price}). Tem entrega para Barro Alto/Mulungu/Canarana? 🛍️`
            )}" target="_blank" class="btn-whatsapp">
                <i>💬</i> Comprar agora no WhatsApp
            </a>
        `;

        document.getElementById('productDetail').innerHTML = html;

        // Atualiza o contador do lightbox (já tem currentImages)
        atualizarContador();
    }

    // =============================================
    // EVENTOS DO LIGHTBOX
    // =============================================
    document.addEventListener('DOMContentLoaded', function() {
        renderizarProduto();

        // Fechar com o X
        document.getElementById('closeLightbox').addEventListener('click', fecharLightbox);

        // Fechar clicando fora da imagem (no fundo escuro)
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) fecharLightbox();
        });

        // Navegação com setas
        document.getElementById('prevImage').addEventListener('click', function(e) {
            e.stopPropagation();
            navegar(-1);
        });
        document.getElementById('nextImage').addEventListener('click', function(e) {
            e.stopPropagation();
            navegar(1);
        });

        // Teclado: ESC fecha, setas esquerda/direita navegam
        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') fecharLightbox();
            if (e.key === 'ArrowLeft') navegar(-1);
            if (e.key === 'ArrowRight') navegar(1);
        });
    });
</script>

</body>
</html>
